server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The FuzeFront shell (app.fuzefront.com) imports remoteEntry.js and its
    # chunks same-origin via the federatedMount Ingress
    # (deploy/helm/fuzex/templates/federated-mount-ingress.yaml) — CORS is
    # harmless defense in depth for any direct/cross-origin probe.
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # remoteEntry.js must never be cached stale.
    location = /apps/fuzex/remoteEntry.js {
        alias /usr/share/nginx/html/remoteEntry.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # MFE assets — same-origin portal mount at app.fuzefront.com/apps/fuzex/*.
    # webapp/vite.config.ts sets `base: '/apps/fuzex/'` and `assetsDir: ''`, so
    # the build emits remoteEntry.js and every chunk flat at the root of
    # dist/ — and ../Dockerfile's webapp-mfe stage copies that flat output
    # straight to the nginx docroot (no nested apps/fuzex/ subdirectory), so
    # this location aliases the /apps/fuzex/ URL prefix straight back onto
    # the docroot. If either side of that pair ever changes (a nested output
    # dir, or `assetsDir` reverting to the vite default), this alias and the
    # Dockerfile's COPY layout must change together or requests here start
    # 404ing behind a 200 on remoteEntry.js itself.
    # ^~ stops nginx from falling through to the extension-match location
    # below, so this block's headers are the ones that apply.
    location ^~ /apps/fuzex/ {
        alias /usr/share/nginx/html/;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
