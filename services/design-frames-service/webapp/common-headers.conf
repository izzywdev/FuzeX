# Shared response headers.
#
# nginx's `add_header` does NOT append to the inherited set -- a location block
# that calls it AT ALL replaces every header inherited from the server block.
# So a location adding only Access-Control-Allow-Origin silently DROPS
# Access-Control-Allow-Methods, which is exactly the bug Semgrep's
# generic.nginx.security.header-redefinition flagged here, and it was live: the
# /apps/fuzex/ locations that serve the federated bundle lost the Methods
# header entirely.
#
# Keeping the full set in one included file is what stops it drifting again --
# re-listing the headers by hand in each location works right up until someone
# adds a third header to the server block and not to the copies.
add_header Access-Control-Allow-Origin  * always;
add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
