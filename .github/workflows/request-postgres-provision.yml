name: Request service PostgreSQL provisioning

# FuzeX owns this runtime declaration. FuzeInfra receives only the generic
# `provision-service-postgres` event and validates it against its declared
# allocation and credential-handoff data before opening a reviewable GitOps PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-postgres-provision
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request generic Postgres provisioning
        env:
          GH_TOKEN: ${{ secrets.FUZEINFRA_DISPATCH_TOKEN }}
          REQUESTER: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::FUZEINFRA_DISPATCH_TOKEN is required. It must be a fine-grained token scoped only to izzywdev/FuzeInfra with Contents: read+write.'
            exit 1
          fi
          jq -nc --arg requester "$REQUESTER" \
            '{event_type:"provision-service-postgres",client_payload:{service:"fuzex",role:"fuzex_svc",database:"fuzex_design_frames",consumerRepo:$requester,handoffId:"fuzex-postgres",target:{namespace:"fuzex",secretName:"fuzex-design-frames-db",manifestPath:"deploy/helm/fuzex/files/secrets/design-frames-db-sealed.yaml",branch:"master"}}' \
            | gh api --method POST repos/izzywdev/FuzeInfra/dispatches --input -
          echo 'Requested generic FuzeInfra provisioning. Track the resulting reviewed GitOps PR there.'
