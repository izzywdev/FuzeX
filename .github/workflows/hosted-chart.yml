name: Hosted workspace chart

on:
  pull_request:
    paths:
      - 'deploy/helm/fuzex/**'
      - 'scripts/check-hosted-chart.py'
      - '.github/workflows/hosted-chart.yml'
  push:
    branches: [master]
    paths:
      - 'deploy/helm/fuzex/**'
      - 'scripts/check-hosted-chart.py'
      - '.github/workflows/hosted-chart.yml'

permissions:
  contents: read

jobs:
  hosted-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.16.4
      - run: pip install PyYAML==6.0.3
      - run: python scripts/check-hosted-chart.py
      - run: helm lint deploy/helm/fuzex -n fuzex -f deploy/helm/fuzex/values-prod.yaml --set postgresTier.enabled=true
