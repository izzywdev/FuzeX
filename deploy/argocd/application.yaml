# =============================================================================
# Argo CD Application — FuzeX (prod, Contabo k3s)
# =============================================================================
# OWNED BY THIS REPO. FuzeInfra's docs/CONSUMER_ONBOARDING_SHARED_CLUSTER.md is
# explicit about the split:
#
#   "the consumer owns its deploy/** (Helm/kustomize + Argo Applications +
#    sealed secrets). FuzeInfra owns the cluster, Argo, the tunnel, and the
#    shared datastores."
#
# FuzeInfra registers this directory ONCE via its `argocd-register` workflow;
# thereafter Argo polls and self-syncs deploy/argocd from this repo.
#
# ONE Application per repo. Do not add a second: two Applications with
# prune+selfHeal over one namespace, holding disagreeing values, each prune what
# the other did not create (cf. FuzeContact#33, FuzeMarket#61).
#
# NOTHING SYNCS FROM THIS FILE ALONE. values-prod.yaml ships `enabled: false`, so
# a first sync renders an empty release on purpose — the image is unpublished and
# `fuzefront-registration` is unsealed, and a fail-closed registration init
# container plus a nonexistent image is a CrashLoopBackOff, not a deployment.
# The go-live order is in values-prod.yaml's header.
#
# DO NOT edit the image tag here — it lives in deploy/helm/fuzex/values-prod.yaml.
# DO NOT apply this from CI or by hand; registration is an owner action.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fuzex
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Restricted project, defined alongside this file in project.yaml. Scoped to
  # the fuzex namespace and this repo only — strictly narrower than `default`.
  project: fuzex
  source:
    repoURL: https://github.com/izzywdev/FuzeX.git
    targetRevision: master
    path: deploy/helm/fuzex
    helm:
      releaseName: fuzex
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fuzex
  syncPolicy:
    automated:
      # PRUNE IS OFF, AND THAT IS THE POINT OF THIS COMMENT.
      #
      # design-frames-service is stateful: every feature manifest, frame, content
      # stamp and per-flow APPROVAL is a file on the PersistentVolumeClaim
      # (lib/store.js — there is no database). The PVC carries
      # `helm.sh/resource-policy: keep`, which stops HELM from deleting it — Argo's
      # pruner does not read that annotation, so with prune on, a rename or a
      # momentarily-misrendered chart would collect the claim and take every
      # approval with it. Approvals are exactly what this service exists to hold,
      # and their loss reads as "the design was never signed off".
      #
      # The sibling stateless products (FuzeDeploy, FuzePlan) run prune: true
      # safely. This one must not, until the store is somewhere a delete is
      # recoverable from.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
