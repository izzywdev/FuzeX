{{- if and .Values.enabled .Values.postgresTier.enabled }}
{{- if not .Values.persistence.enabled }}
{{- fail "postgresTier.enabled requires persistence.enabled: immutable frame snapshots need durable storage" }}
{{- end }}
{{/*
design-frames-service Postgres LIFECYCLE TIER — the isolated Express+pg+TS
process from services/design-frames-service/backend/ (docs/postgres-tier.md).
A SEPARATE Deployment from the vanilla frontend above: its own image (the
Dockerfile's `postgres-tier` build target), its own port (4410), its own
rollout. This tier becomes the sole hosted writer; the legacy Deployment is
disabled. Immutable HTML snapshots still use the single-writer PVC, requiring
one replica and Recreate until content moves into a transactional shared store.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuzex.fullname" . }}-postgres-tier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzex.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-tier
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fuzex.pgTierSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzex.pgTierSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/database-secret: {{ .Files.Get "files/secrets/design-frames-db-sealed.yaml" | sha256sum }}
        {{- if .Values.registration.enabled }}
        checksum/registration: {{ (.Files.Glob "files/registration/*").AsConfig | sha256sum }}
        {{- end }}
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.registration.enabled }}
      initContainers:
        - name: fuzefront-register
          image: {{ .Values.registration.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eu
              apk add --no-cache curl jq >/dev/null
              exec /registration/register.sh
          env:
            - name: FUZEFRONT_API_URL
              value: {{ .Values.registration.apiUrl | quote }}
            - name: FUZEFRONT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registration.secretName | quote }}
                  key: token
            - name: REGISTRATION_DIR
              value: /registration
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - { name: registration, mountPath: /registration, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      {{- end }}
      containers:
        - name: postgres-tier
          image: "{{ .Values.postgresTier.image.repository }}:{{ .Values.postgresTier.image.tag }}"
          imagePullPolicy: {{ .Values.postgresTier.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.postgresTier.service.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: DESIGN_FRAMES_HOST
              value: "0.0.0.0"
            - name: DESIGN_FRAMES_PG_PORT
              value: {{ .Values.postgresTier.service.port | quote }}
            - name: DESIGN_FRAMES_DATA_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: FUZEFRONT_API_URL
              value: {{ required "fuzefront.apiUrl is required for hosted write authentication" .Values.fuzefront.apiUrl | quote }}
            - name: DESIGN_FRAMES_REQUIRED_SCOPE
              value: {{ .Values.fuzefront.requiredScope | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.postgresTier.logLevel | quote }}
            # FuzeInfra publishes the sealed credential into this chart's files/
            # directory; templates/design-frames-db-sealed.yaml applies it.
            # NOT optional: backend/src/lib/db.ts throws on the first query if
            # this is unset, so a pod missing it should fail loudly rather
            # than silently 500 every lifecycle request.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresTier.databaseSecret.name | quote }}
                  key: {{ .Values.postgresTier.databaseSecret.key | quote }}
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgresTier.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ['ALL']
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "fuzex.dataClaimName" . }}
        {{- if .Values.registration.enabled }}
        - name: registration
          configMap:
            name: {{ .Values.registration.configMapName | quote }}
            defaultMode: 365
        {{- end }}
{{- end }}
