{{- if and .Values.enabled .Values.federatedMount.enabled }}
{{- $apiPath := required "federatedMount.apiPath is required" .Values.federatedMount.apiPath }}
{{- if ne $apiPath "/apps/fuzex/api" }}
{{- fail "federatedMount.apiPath must be /apps/fuzex/api to avoid capturing portal APIs" }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "fuzex.fullname" . }}-api-prefix
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzex.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ $apiPath | quote }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fuzex.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzex.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-api-prefix@kubernetescrd" .Release.Namespace (include "fuzex.fullname" .) | quote }}
spec:
  {{- with .Values.federatedMount.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "federatedMount.host is required" .Values.federatedMount.host | quote }}
      http:
        paths:
          - path: {{ $apiPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "fuzex.fullname" . }}{{ if .Values.postgresTier.enabled }}-postgres-tier{{ end }}
                port:
                  number: {{ if .Values.postgresTier.enabled }}{{ .Values.postgresTier.service.port }}{{ else }}{{ .Values.service.port }}{{ end }}
{{- end }}
