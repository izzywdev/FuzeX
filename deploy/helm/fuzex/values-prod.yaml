# =============================================================================
# FuzeX — production overlay (Contabo k3s, via Argo CD)
# =============================================================================
# The image tag below is bumped by .github/workflows/release.yml; Argo detects
# the diff and rolls it. DO NOT edit it by hand.
#
# `enabled` stays FALSE, and that is the honest state rather than an omission.
# Two things are not true yet:
#
#   1. ghcr.io/izzywdev/fuzex-design-frames-service has never been published.
#      release.yml (added alongside this chart) is what will publish it; until a
#      push to master runs it, this tag names an image that does not exist and
#      the pod would ImagePullBackOff.
#   2. `fuzefront-registration` does not exist as a SealedSecret in the fuzex
#      namespace. The registration init container is fail-closed by design, so
#      without it the pod will not start.
#
# TO GO LIVE, in this order:
#   1. merge a change under services/design-frames-service/ to master — release.yml
#      builds and pushes the image and bumps the tag below.
#   2. seal `fuzefront-registration` (key `token`, an apps:register bearer) into
#      the fuzex namespace. The fuzex-registration ConfigMap is NOT a manual step
#      — the chart renders it from files/registration/.
#   3. seal `fuzex-api-tokens` (key DESIGN_FRAMES_API_TOKENS) too, or the service
#      comes up read-only: every write 401s. That is a safe state, not a working
#      one.
#   4. have FuzeInfra provide the DNS/tunnel for fuzex.prod.fuzefront.com, then
#      set ingress.enabled + ingress.host here. registration/manifest.json already
#      points integration.url at that name, so registering before it resolves
#      would activate a portal tile that mounts a dead origin.
#   5. flip `enabled: true`, in ONE PR, during a deploy window.
# =============================================================================
enabled: false

image:
  tag: "2a30510f94f6"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

persistence:
  enabled: true
  size: 5Gi

ingress:
  enabled: false
  className: traefik
  host: ""
