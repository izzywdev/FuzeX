# =============================================================================
# FuzeX — production overlay (Contabo k3s, via Argo CD)
# =============================================================================
# The image tag below is bumped by .github/workflows/release.yml; Argo detects
# the diff and rolls it. DO NOT edit it by hand.
#
# `enabled: true` — flipped in this PR (feat/prod-deploy). Both prior blockers
# are now satisfied:
#
#   1. ghcr.io/izzywdev/fuzex-design-frames-service:6aa1c11f6aff IS published —
#      verified directly against the GHCR manifest API (anonymous pull token,
#      HTTP 200), so the package is public and the tag exists. No imagePullSecret
#      is required for it (see below).
#   2. `fuzefront-registration` exists as a SealedSecret in the fuzex namespace
#      (deploy/argocd/sealed/fuzefront-registration.yaml). The registration init
#      container is fail-closed by design, so this was a hard prerequisite.
#
# STILL DEFERRED, deliberately NOT part of this change:
#   (`fuzex-api-tokens` / DESIGN_FRAMES_API_TOKENS used to be listed here as
#   deferred-but-harmless, on the grounds that its absence left the service
#   "read-only". That was wrong — absent the secret, server.js allowed EVERY
#   write. The secret and the mechanism are both gone as of issue #26: writes now
#   require a FuzeFront machine token, and there is nothing left to seal. The
#   `fuzex-api-tokens` Secret should be DELETED from the cluster if it exists.)
#   - ingress.enabled / ingress.host and federatedMount.enabled / .host stay OFF.
#     ingress.host needs new DNS + a Cloudflare tunnel rule for a *.prod host —
#     a FuzeInfra change, not this repo's to assume. federatedMount would reuse
#     FuzeFront's EXISTING host (app.fuzefront.com) via a same-origin path route,
#     so it needs no new DNS, but adding a second namespace's Ingress object
#     against that host is a cross-repo routing decision (coordinate with
#     FuzeFront's own app.fuzefront.com Ingress rules first) and is out of scope
#     for this PR, which is about standing up the namespace + workload only.
#
# STALE NOTE, CORRECTED: an earlier revision claimed GHCR pulls were failing
# cluster-wide over IPv6 egress on the Contabo nodes. That is not the case and
# was never the cause here — fuzex-fuzex pulls
# ghcr.io/izzywdev/fuzex-design-frames-service:0c25a457f047 successfully in prod
# today. The webapp-mfe pod's ImagePullBackOff was purely a tag that had never
# been published (see webappMfe.image.tag below).
# =============================================================================
enabled: true

image:
  tag: "0c25a457f047"
  pullPolicy: Always

# No imagePullSecrets. A prior revision of this file referenced a secret named
# `ghcr-pull` that was never sealed anywhere in this repo (no SealedSecret
# manifest, no chart template renders one) — an orphan reference that would have
# left the pod referencing a Secret that does not exist in the fuzex namespace.
# It was also unnecessary: ghcr.io/izzywdev/fuzex-design-frames-service is a
# PUBLIC package (confirmed via an anonymous GHCR pull token against the
# manifest API), so no pull credential is needed at all. If this package is
# ever made private, add a real `ghcr-pull-secret` SealedSecret (see FuzeHub's
# helm/fuzehub/templates/ghcr-pull-secret.yaml for the pattern) rather than
# reintroducing a bare name with nothing behind it.

persistence:
  enabled: true
  size: 5Gi

ingress:
  enabled: false
  className: traefik
  host: ""

# webappMfe — the Module-Federation remote's nginx-serving-stage image
# (templates/webapp-mfe.yaml, see values.yaml for the full comment). No
# external prerequisite blocks this the way postgresTier below is blocked:
# release.yml publishes ghcr.io/izzywdev/fuzex-webapp-mfe on every push to
# master that touches services/design-frames-service/**, alongside the main
# image, and bumps this tag the same way. federatedMount stays OFF below
# regardless (cross-repo Ingress coordination, out of scope here), so this
# pod deploying does not yet put traffic through it.
webappMfe:
  image:
    # WEBAPP_MFE_IMAGE_TAG — bumped by release.yml's webapp-mfe build job the
    # same way image.tag above is bumped. DO NOT edit by hand.
    #
    # Hand-corrected once, because the automated bump never reached this key:
    # it was still the "0.1.0" placeholder, and ghcr.io/izzywdev/fuzex-webapp-mfe
    # has NEVER published a 0.1.0 tag. The pod reported
    #   ghcr.io/izzywdev/fuzex-webapp-mfe:0.1.0: not found
    # (a definitive NotFound, not a 401 — the package is public, so the pull was
    # authorized and the tag genuinely does not exist).
    # 303e2020069c is the newest tag actually published for this package
    # (2026-09-01T12:37:27Z), and the same release also published
    # fuzex-design-frames-service:303e2020069c.
    tag: "303e2020069c"
    pullPolicy: Always

# =============================================================================
# postgresTier — Postgres lifecycle tier (services/design-frames-service/backend/
# + db/migrations/, docs/postgres-tier.md). Stays FALSE here for the same
# reason the top-level `enabled` above does: the image, the FuzeInfra-side
# database/role/schema, and the DATABASE_URL SealedSecret in `fuzex` do not
# exist yet (deploy/infra-requests/design-frames-postgres.md is the hand-off
# request for the latter two). Flip to true only after all three exist, in
# ONE PR, during a deploy window.
# =============================================================================
postgresTier:
  enabled: false

  image:
    # POSTGRES_TIER_IMAGE_TAG — bumped by release.yml's postgres-tier build
    # job the same way image.tag above is bumped. DO NOT edit by hand.
    tag: "0c25a457f047"
    pullPolicy: Always

# Same-origin portal mount. WITHOUT THIS THE APP CANNOT LOAD IN THE PORTAL:
# federatedMount.enabled defaults to false in values.yaml, so production had no
# /apps/<slug> Ingress at all and the browser fell through to the FuzeFront
# shell's SPA fallback — a 404, or a 200 serving the shell's own index.html.
# Measured across the fleet 2026-08-26: 11 of 17 products were unmounted for
# exactly this reason. The host resolves integration.remoteEntry against its own
# origin, so this path must match registration/manifest.json.
federatedMount:
  enabled: true
  host: app.fuzefront.com
